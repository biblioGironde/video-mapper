# Construit l'application pour macOS, Windows et Linux et la publie dans une
# « Release » GitHub nommée d'après la version de package.json (ex. v1.0.0).
#
# Se déclenche :
#  - quand package.json change sur main (il suffit d'augmenter « version ») ;
#  - quand on pousse un tag v1.2.3 ;
#  - à la main depuis l'onglet Actions (« Run workflow »).
# Si la version existe déjà en Release, rien n'est reconstruit.
name: Release

on:
  push:
    branches: [main]
    paths: ["package.json", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "La release $TAG existe déjà : rien à faire."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: npx electron-builder --mac
          - os: windows-latest
            cmd: npx electron-builder --win --x64
          - os: ubuntu-latest
            cmd: npx electron-builder --linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire
        run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: video-mapper-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Video Mapper ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Téléchargement
            - **Mac Apple Silicon (M1–M4)** : `VideoMapper-…-macOS-arm64.dmg`
            - **Mac Intel** : `VideoMapper-…-macOS-x64.dmg`
            - **Windows** : `VideoMapper-Installer-….exe` (installeur) ou `VideoMapper-…-Windows-x64.zip` (portable)
            - **Linux** : `VideoMapper-…-Linux-x86_64.AppImage`

            L'application n'est pas signée par un certificat éditeur :
            - macOS : après l'avoir glissée dans Applications, lancer une fois dans le Terminal
              `xattr -cr "/Applications/Video Mapper.app"`
            - Windows : « Informations complémentaires » puis « Exécuter quand même ».

            Version web : https://bibliogironde.github.io/video-mapper/
